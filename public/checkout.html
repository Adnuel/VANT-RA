<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VANTÉRA — Secure Checkout</title>
  <meta name="description" content="Secure Checkout for VANTÉRA curated tech finds. Authenticated client accounts, state-based delivery, and verified payment confirmation." />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #F7F3EC;
      color: #111111;
      font-family: 'Montserrat', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 420px;
      width: 100%;
      background: #FAF7F2;
      border: 1px solid rgba(17, 17, 17, 0.1);
      padding: 36px 28px;
      text-align: center;
    }
    .brand {
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      letter-spacing: 0.28em;
      color: #111111;
      font-weight: 500;
      margin-bottom: 14px;
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 24px;
      font-weight: 500;
      margin: 0 0 10px;
    }
    p {
      font-size: 13px;
      line-height: 1.6;
      color: #5C574E;
      margin: 0 0 22px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 13px 16px;
      background: #B89B5E;
      color: #111111;
      text-decoration: none;
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">VANTÉRA</div>
    <h1 id="heading">Preparing Checkout...</h1>
    <p id="message">
      Routing you to your authenticated VANTÉRA checkout session.
    </p>
    <a id="fallbackLink" href="/account?mode=login&returnTo=cart" class="btn">
      Continue to Checkout
    </a>
  </div>

  <script>
    (function () {
      var hasToken = false;
      try {
        hasToken = Boolean(localStorage.getItem('vantera_customer_token'));
      } catch (e) {}

      var target = hasToken ? '/?openCart=1' : '/account?mode=login&returnTo=cart';
      var link = document.getElementById('fallbackLink');
      if (link) link.setAttribute('href', target);
      if (hasToken) {
        document.getElementById('heading').textContent = 'Opening Your Bag...';
        document.getElementById('message').textContent = 'Redirecting to your verified checkout session.';
      }
      window.location.replace(target);
    })();
  </script>
</body>
</html>
