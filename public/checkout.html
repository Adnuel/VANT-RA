<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VANTÉRA — Secure Atelier Checkout</title>
  <meta name="description" content="Secure Checkout for VANTÉRA curated tech finds. Authenticated client accounts, state-based delivery, and verified payment confirmation." />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #0B0B0B;
      color: #F5F5F0;
      font-family: 'Montserrat', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 420px;
      width: 100%;
      background: #121212;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 32px;
      text-align: center;
    }
    .brand {
      font-family: 'Cinzel', serif;
      font-size: 20px;
      letter-spacing: 0.25em;
      color: #D4AF37;
      font-weight: 700;
      margin-bottom: 12px;
    }
    h1 {
      font-family: 'Cinzel', serif;
      font-size: 20px;
      margin: 0 0 10px;
    }
    p {
      font-size: 13px;
      line-height: 1.6;
      color: #A9A69F;
      margin: 0 0 20px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 12px 16px;
      background: linear-gradient(135deg, #E6C875 0%, #D4AF37 50%, #9E730D 100%);
      color: #0B0B0B;
      text-decoration: none;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">VANTÉRA</div>
    <h1 id="heading">Preparing Authenticated Checkout...</h1>
    <p id="message">
      Guest checkout is disabled for client protection. Routing you to secure checkout.
    </p>
    <a id="fallbackLink" href="/account?mode=login&returnTo=cart" class="btn">
      Continue to Checkout
    </a>
  </div>

  <script>
    (function () {
      var hasToken = false;
      try {
        hasToken = Boolean(localStorage.getItem('vantera_customer_token'));
      } catch (e) {}

      var target = hasToken ? '/?openCart=1' : '/account?mode=login&returnTo=cart';
      var link = document.getElementById('fallbackLink');
      if (link) link.setAttribute('href', target);
      if (hasToken) {
        document.getElementById('heading').textContent = 'Opening Your Bag...';
        document.getElementById('message').textContent = 'Redirecting to your verified checkout session.';
      }
      window.location.replace(target);
    })();
  </script>
</body>
</html>
