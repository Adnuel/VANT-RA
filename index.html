    <script>
      // Suppress Vite HMR WebSocket connection errors in reverse-proxied iframe environment
      window.addEventListener('error', function(event) {
        if (event && (
          (event.message && (event.message.includes('WebSocket') || event.message.includes('ws://') || event.message.includes('wss://'))) ||
          (event.filename && event.filename.includes('@vite/client'))
        )) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        if (event && event.reason && (
          String(event.reason).includes('WebSocket') ||
          String(event.reason).includes('@vite/client')
        )) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
      // Ensure mobile browsers update service workers to eliminate stale cached bundles
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var i = 0; i < registrations.length; i++) {
            registrations[i].update();
          }
        });
      }
    </script>
